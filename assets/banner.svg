<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Ayoub Salih — Full-stack developer</title>
<desc id="desc">A midnight blue banner with turquoise accents and an abstract code window. Thoughtful interfaces. Practical software.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17243a"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="340" rx="20" fill="url(#bg)"/>
<rect width="1200" height="340" rx="20" fill="url(#grid)"/>
<rect x="56" y="54" width="42" height="4" rx="2" fill="url(#accent)"/>
<text x="56" y="94" fill="#5eead4" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">DESIGN · BUILD · KEEP LEARNING</text>
<text x="52" y="170" fill="#f8fafc" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Ayoub Salih</text>
<text x="56" y="217" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">Thoughtful interfaces. Practical software.</text>
<text x="56" y="282" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">FULL-STACK DEVELOPMENT</text>
<g transform="translate(810 65)">
<rect width="310" height="210" rx="14" fill="#0b1220" stroke="#334155"/>
<path d="M0 40 H310" stroke="#334155"/>
<circle cx="22" cy="21" r="4" fill="#5eead4"/><circle cx="38" cy="21" r="4" fill="#818cf8"/><circle cx="54" cy="21" r="4" fill="#475569"/>
<text x="256" y="25" fill="#64748b" font-family="monospace" font-size="12">~/dev</text>
<text x="30" y="124" fill="url(#accent)" font-family="monospace" font-size="48" font-weight="bold">&lt; / &gt;</text>
<rect x="30" y="152" width="100" height="5" rx="2" fill="#5eead4" opacity=".65"/>
<rect x="143" y="152" width="72" height="5" rx="2" fill="#818cf8" opacity=".5"/>
<rect x="30" y="171" width="65" height="5" rx="2" fill="#475569"/>
